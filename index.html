<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuralSpace — AI Tools Explorer</title>
<style>
:root {
  --bg: #090b10;
  --panel: #11151e;
  --border: #252c3a;
  --text: #f4f6fb;
  --muted: #9aa5b8;
  --accent: #a78bfa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, system-ui, sans-serif;
}
header {
  padding: 22px 7%;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-size: 22px; font-weight: 800; }
.logo span { color: var(--accent); }
header a { color: var(--muted); text-decoration: none; }
.hero {
  max-width: 850px;
  margin: 75px auto 45px;
  padding: 0 22px;
  text-align: center;
}
.tag {
  color: var(--accent);
  font-size: 12px;
  letter-spacing: 2px;
  font-weight: 700;
}
h1 {
  font-size: clamp(38px, 7vw, 68px);
  letter-spacing: -2px;
  line-height: 1.08;
  margin: 22px 0;
}
h1 span {
  background: linear-gradient(90deg,#c4b5fd,#60a5fa);
  -webkit-background-clip: text;
  color: transparent;
}
.hero p { color: var(--muted); line-height: 1.8; }
.search {
  display: flex;
  max-width: 600px;
  margin: 28px auto;
  gap: 10px;
}
input {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: white;
  padding: 16px;
  outline: none;
}
input:focus { border-color: var(--accent); }
main { max-width: 1100px; margin: auto; padding: 0 22px 70px; }
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 25px;
}
button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--muted);
  border-radius: 9px;
  padding: 10px 15px;
  cursor: pointer;
}
button.active, button:hover {
  color: white;
  border-color: var(--accent);
  background: #211b36;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
  gap: 17px;
}
.card {
  background: linear-gradient(145deg,#141923,#0d1017);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 23px;
  transition: transform .2s,border-color .2s;
}
.card:hover { transform: translateY(-4px); border-color: #7662b5; }
.icon { font-size: 30px; }
.card h3 { margin-bottom: 8px; }
.card p { color: var(--muted); line-height: 1.6; font-size: 14px; min-height: 45px; }
.category { color: var(--accent); font-size: 12px; }
.card a { color: white; font-size: 13px; text-decoration: none; }
.empty { color: var(--muted); text-align: center; padding: 35px; }
footer {
  text-align: center;
  padding: 30px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 13px;
}
@media(max-width:500px) {
  header { padding: 18px; }
  .hero { margin-top: 55px; }
  .search { flex-direction: column; }
}
</style>
</head>
<body>
<header>
  <div class="logo">Neural<span>Space.</span></div>
  <a href="https://github.com/" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
</header>

<section class="hero">
  <div class="tag">YOUR AI DISCOVERY HUB</div>
  <h1>Discover tools.<br><span>Build the future.</span></h1>
  <p>Explore a curated collection of AI tools for creativity,
     productivity, coding and intelligent workflows.</p>
  <div class="search">
    <input id="search" type="search"
      placeholder="Search AI tools..." aria-label="Search AI tools">
  </div>
</section>

<main>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div id="empty" class="empty" hidden>No matching tools found.</div>
</main>

<footer>NeuralSpace © 2026 · Built for curious minds.</footer>

<script>
const tools = [
  {name:"ChatGPT",icon:"✦",category:"Writing",
   desc:"AI assistant for writing, research and everyday tasks.",
   url:"https://chatgpt.com/"},
  {name:"Claude",icon:"◈",category:"Writing",
   desc:"An AI assistant for analysis, writing and coding.",
   url:"https://claude.ai/"},
  {name:"Hugging Face",icon:"🤗",category:"Models",
   desc:"Explore open-source models, datasets and AI demos.",
   url:"https://huggingface.co/"},
  {name:"ComfyUI",icon:"⬡",category:"Images",
   desc:"Build node-based workflows for generative media.",
   url:"https://www.comfy.org/"},
  {name:"GitHub",icon:"⌘",category:"Coding",
   desc:"Host code, collaborate and manage software projects.",
   url:"https://github.com/"},
  {name:"Google AI Studio",icon:"✧",category:"Models",
   desc:"Experiment with Google's generative AI models.",
   url:"https://aistudio.google.com/"},
  {name:"ElevenLabs",icon:"♫",category:"Audio",
   desc:"Explore AI voice generation and audio tools.",
   url:"https://elevenlabs.io/"},
  {name:"Runway",icon:"▶",category:"Video",
   desc:"Explore AI-powered video creation tools.",
   url:"https://runwayml.com/"},
  {name:"Cursor",icon:"⌁",category:"Coding",
   desc:"An AI-powered code editor for software development.",
   url:"https://cursor.com/"}
];

const categories = ["All", ...new Set(tools.map(t=>t.category))];
let selected = "All";

const filters = document.getElementById("filters");
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const empty = document.getElementById("empty");

function renderFilters() {
  filters.innerHTML = "";
  categories.forEach(category => {
    const button = document.createElement("button");
    button.textContent = category;
    button.className = selected === category ? "active" : "";
    button.onclick = () => {
      selected = category;
      renderFilters();
      renderTools();
    };
    filters.appendChild(button);
  });
}

function renderTools() {
  const query = search.value.toLowerCase().trim();
  const visible = tools.filter(tool =>
    (selected === "All" || tool.category === selected) &&
    (tool.name + " " + tool.desc + " " + tool.category)
      .toLowerCase().includes(query)
  );

  grid.innerHTML = "";
  visible.forEach(tool => {
    const card = document.createElement("article");
    card.className = "card";

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = tool.icon;

    const title = document.createElement("h3");
    title.textContent = tool.name;

    const category = document.createElement("div");
    category.className = "category";
    category.textContent = tool.category;

    const desc = document.createElement("p");
    desc.textContent = tool.desc;

    const link = document.createElement("a");
    link.href = tool.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Explore tool ↗";

    card.append(icon, title, category, desc, link);
    grid.appendChild(card);
  });

  empty.hidden = visible.length > 0;
}

search.addEventListener("input", renderTools);
renderFilters();
renderTools();
</script>
</body>
</html>
